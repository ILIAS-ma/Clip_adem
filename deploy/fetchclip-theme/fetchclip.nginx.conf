# ============================================================
# FetchClip, servi tel quel.
#
# Le service Node écoute sur 127.0.0.1:3000 et n'est pas exposé : tout
# passe par ici. Son code n'est pas modifié, d'où deux conséquences
# visibles dans ce fichier.
#
# D'abord le montage de ses chemins absolus (/style.css, /app.js,
# /api/...) à la racine du domaine, là où son index.html les demande.
# Aucun ne concurrence Laravel, qui sert ses propres assets sous /build.
#
# Ensuite l'injection du thème par sub_filter, plutôt qu'une retouche de
# sa feuille : son dépôt reste intact et `git pull` continue de
# fonctionner sans conflit.
#
# auth_request demande à Laravel, avant chaque requête, si la session
# appartient à un clippeur. Sans cela l'outil serait public : il n'a
# aucune authentification, il a été écrit pour une seule machine.
# ============================================================

location = /_studio-auth {
    internal;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;

    # include EN PREMIER : fastcgi_params repose REQUEST_URI sur l'URI
    # d'origine de la requête, pas sur celle de la sous-requête. Placé
    # après, il écrasait les valeurs ci-dessous et Laravel cherchait la
    # route /fetchclip au lieu de /_studio-auth — 404, donc refus, donc
    # 500 côté client.
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME /var/www/clipadem/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_URI /_studio-auth;
    fastcgi_param REQUEST_URI /_studio-auth;
    fastcgi_param QUERY_STRING "";
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
}

# La page elle-même : un visiteur sans session part se connecter, et
# revient à l'outil ensuite plutôt que sur le tableau de bord.
location @vers_connexion {
    return 302 /connexion-studio;
}

# L'API, elle, ne redirige jamais. Le navigateur suit une redirection sans
# rien dire : il recevait la page de connexion en HTML avec un code 200, et
# l'outil, qui attend du JSON, la prenait pour une réponse vide mais
# réussie. D'où « undefined » partout — un lien vers name=undefined, puis
# « Cannot read properties of undefined (reading 'length') » — au lieu de
# « session expirée ».
location @refus_json {
    default_type application/json;
    return 401 '{"error":"Session expirée. Reconnecte-toi pour continuer."}';
}

# Le thème de Clip Adem. Servi d'ici et non depuis le dépôt de
# FetchClip, pour que `git pull` n'ait jamais de conflit à résoudre.
#
# `no-cache` oblige le navigateur à revalider à chaque visite. Sans cet
# en-tête il gardait l'ancienne version indéfiniment — l'adresse ne porte
# pas de numéro de version — et toute correction demandait un Ctrl+F5 que
# personne ne devine. Deux fichiers de quelques kilooctets : la
# revalidation ne coûte rien.
location = /clipadem-theme.css {
    alias /var/www/fetchclip-theme/theme.css;
    add_header Cache-Control "no-cache";
}

location = /clipadem-theme.js {
    alias /var/www/fetchclip-theme/theme.js;
    add_header Cache-Control "no-cache";
}

location /fetchclip {
    auth_request /_studio-auth;
    error_page 401 = @vers_connexion;

    rewrite ^/fetchclip/?$ / break;
    rewrite ^/fetchclip/(.*)$ /$1 break;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # sub_filter ne sait pas réécrire une réponse compressée : on demande
    # du clair à l'amont, qui de toute façon ne compresse pas.
    proxy_set_header Accept-Encoding "";

    # Un rendu ffmpeg peut tenir plusieurs minutes.
    proxy_read_timeout 900;
    proxy_send_timeout 900;

    # Trois ancrages stables dans son index.html.
    #
    # Le lien de sa feuille porte deux ajouts d'un coup — le thème et
    # l'icône — et non deux règles : la première remplacerait le texte que
    # la seconde cherche, qui ne s'appliquerait jamais.
    #
    # Le thème passe après sa feuille pour redéfinir ses jetons. L'icône
    # passe après la sienne, un carré bleu dessiné en SVG dans l'adresse
    # même : le navigateur retient la dernière déclaration, et la réécrire
    # demanderait de reproduire toute cette adresse.
    #
    # Le script juste avant la fermeture du corps, pour que le document
    # soit construit quand il s'exécute.
    sub_filter '<link rel="stylesheet" href="/style.css" />'
               '<link rel="stylesheet" href="/style.css" /><link rel="stylesheet" href="/clipadem-theme.css" /><link rel="icon" type="image/png" href="/images/logo.png?v=640" />';

    sub_filter '<title>FetchClip — Studio de clips</title>'
               '<title>Clip Adem — Mode créateur</title>';

    # Son icône est neutralisée plutôt que concurrencée : déclarer une
    # seconde icône plus bas ne suffisait pas, le navigateur gardait le
    # carré bleu. En lui retirant son `href`, il ne reste qu'un candidat.
    sub_filter 'rel="icon" href="data:image/svg+xml,'
               'rel="icon" data-ancien="data:image/svg+xml,';

    sub_filter '</body>'
               '<script src="/clipadem-theme.js" defer></script></body>';

    # L'identité du clippeur, transmise à l'outil : c'est elle qui décide
    # de son espace de travail. Elle vient de la réponse de Laravel, donc
    # le navigateur ne peut pas la choisir.
    auth_request_set $clipper_id $upstream_http_x_clipper_id;
    proxy_set_header X-Clipper-Id $clipper_id;
    sub_filter_once off;
    sub_filter_types text/html;

    # La page elle-même porte les deux balises injectées : la garder en
    # cache reviendrait à garder une page sans thème.
    add_header Cache-Control "no-cache";
}

# Son interface et son API, aux adresses que son code demande.
location ~ ^/(api|vendor)/ {
    auth_request /_studio-auth;
    error_page 401 = @refus_json;

    # L'API fait tout le travail sur les fichiers : sans cette identité,
    # elle écrirait dans l'espace commun au lieu de celui du clippeur.
    auth_request_set $clipper_id $upstream_http_x_clipper_id;
    proxy_set_header X-Clipper-Id $clipper_id;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 900;
    proxy_send_timeout 900;
    client_max_body_size 512M;
}

location ~ ^/(style\.css|app\.js|anim\.js)$ {
    auth_request /_studio-auth;
    error_page 401 = @vers_connexion;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
