# Configuration globale de yt-dlp sur ce serveur.
#
# Elle existe pour une seule raison : Twitch sert désormais certains clips
# en HEVC (H.265), à toutes les qualités. Les navigateurs ne savent pas le
# décoder — le lecteur rend le son et une image noire, ce qui ressemble à
# une vidéo cassée plutôt qu'à un problème de codec.
#
# yt-dlp affiche « unknown » comme codec pour tous les formats Twitch :
# aucun tri à la sélection ne peut l'éviter. Il faut donc regarder le
# fichier obtenu, et c'est ce que fait le script ci-dessous.
#
# Passer par la configuration de yt-dlp plutôt que par le code de
# FetchClip garde son dépôt intact : `git pull` continue de fonctionner.

--exec "/usr/local/bin/clipadem-h264 %(filepath)q"
