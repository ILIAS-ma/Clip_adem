# ============================================================
# Reverb, le serveur WebSocket de la messagerie.
#
# Il écoute sur 127.0.0.1:8080 et n'est pas exposé : seuls les
# navigateurs passent par ici, sur /app/, pour recevoir les messages
# en direct. L'API de publication (/apps/) reste interne — le site
# publie directement sur 127.0.0.1:8080, sans faire le tour par
# Internet.
# ============================================================

# L'adresse exacte du protocole, /app/<clé>, et rien d'autre : un préfixe
# /app/ laissait les robots qui cherchent /app/.env atteindre Reverb, qui
# leur répondait par une erreur 500 — et contournait au passage la règle
# Nginx qui refuse les fichiers cachés.
location ~ ^/app/[A-Za-z0-9]+$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Une connexion WebSocket reste ouverte des heures. Reverb envoie un
    # ping toutes les minutes : deux minutes de silence, c'est une
    # connexion morte.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
